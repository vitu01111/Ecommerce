<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Edit Product</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
<div class="container mt-4">
    <h2>Edit Product</h2>
    <form method="POST" action="/administrator/product/editForm/{{edit_pro.id}}" enctype="multipart/form-data">
        <div class="mb-3">
            <label for="name" class="form-label">Product Name</label>
            <input type="text" class="form-control" id="name" name="name" value="{{ edit_pro.name }}" required>
        </div>
        <div class="mb-3">
            <label for="category_id" class="form-label">Category</label>
            <select class="form-select" id="category_id" name="category_id">
                {% for cat in edit_cat %}
                    <option value="{{ cat.id }}" {{edit_pro.id}}>{{ cat.name }}</option>
                {% endfor %}
            </select>
        </div>
        <div class="mb-3">
            <label for="image" class="form-label">Image</label>
            {% if edit_pro.image %}
                <div class="mb-2">
                    <img src="{{ url_for('static', filename='uploads/' ~ edit_pro.image) }}" width="80">
                </div>
            {% endif %}
            <input type="file" class="form-control" id="image" name="image">
        </div>
        <div class="mb-3">
            <label for="date" class="form-label">Date</label>
            <input type="date" class="form-control" id="date" name="date" value="{{ edit_pro.date.strftime('%Y-%m-%d') if edit_pro else '' }}" required>
        </div>
        <div class="mb-3">
            <label for="price" class="form-label">Price</label>
            <input type="number" step="0.01" class="form-control" id="price" name="price" value="{{ edit_pro.price }}" required>
        </div>
        <div class="mb-3">
            <label for="qty" class="form-label">Quantity</label>
            <input type="number" class="form-control" id="qty" name="qty" value="{{ edit_pro.qty }}" required>
        </div>
        <div class="mb-3">
            <label for="article" class="form-label">Article</label>
            <textarea class="form-control" id="article" name="article">{{ edit_pro.article }}</textarea>
        </div>
        <div class="mb-3">
            <label for="country" class="form-label">Country</label>
            <input type="text" class="form-control" id="country" name="country" value="{{ edit_pro.country }}" required>
        </div>
        <button type="submit" class="btn btn-primary">Update</button>
        <a href="/administrator/product/" class="btn btn-secondary">Cancel</a>

    </form>
</div>
</body>
</html>
