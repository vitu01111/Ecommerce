<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Edit Category</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
<div class="container mt-4">
    <h2>Edit Category</h2>
    <form method="POST" action="/administrator/category/editFormData/{{ GetNewCategory.id }}">
        <div class="mb-3">
            <label for="name" class="form-label">Category Name</label>
            <input type="text" class="form-control" id="name" name="name" value="{{ GetNewCategory.name}}" required>
        </div>
        <button type="submit" class="btn btn-primary">Update</button>
        <a href="/administrator/category/" class="btn btn-secondary">Cancel</a>
    </form>
</div>
</body>
</html>
