        <style>
        
        
        
        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;

            /* background-color: #ffffff; */

            text-decoration: none;
            color: #333;
            font-size: 15px;
            font-weight: 500;

            grid-gap: 5px;
        }
        .header-scroll-down>a>i,

        }
        .logo {

            font-weight: bold;

        }

        }
        
        .nav-links a {

        }
        
        .header-right {
            display: flex;
            gap: 20px;
            align-items: center;
        }

        .countCart{

        .main-content {

            justify-content: center;

            padding: 85px 0 0 0;

            display: flex;

        .contentBody{

            height: fit-content;
            width: 100%;

        .hero-section h1 {

            font-weight: bold;

        .filters {

            flex-wrap: wrap;
        }
        
        .filter {
            background-color: #ffffff;
            padding: 12px 20px;
            border-radius: 50px;
            border: 1px solid #e0e0e0;
            font-size: 14px;
            cursor: pointer;

        }
        
        .filter:hover {
            background-color: #f5f5f5;
        }
        
        .filter select {
            border: none;
            background: transparent;
            font-size: 14px;
            cursor: pointer;
            outline: none;
        }
        
        .products {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
            gap: 30px;

            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(255px, 1fr));

            backdrop-filter: blur(2px);
            -webkit-backdrop-filter: blur(2px);
            border-bottom: 1px solid rgba(255, 255, 255, 0.2);

            cursor: pointer;
            min-width: 155px;
        }
        .headerProfile>.bx-chevron-down {
            position: absolute;
            right: 10px;
        }
       
        .headerProfileGp>.headerProfile{
            border-radius: 20px 20px 0 0;
            border-bottom: none;
            background: #fff !important;
            border-bottom: 0;
            box-shadow: 0 8px 32px rgb(0 0 0 / 25%);
        }
        .headerProfileGp>button>i {
            transform: rotate(180deg);
        }
        .cartCount{
            position: absolute;
            top: -3px;
            right: -3px;

            min-width: 17px;
            font-size: 9px;
            height: 17px;
            border-radius: 50%;
            display: flex !important;
            align-items: center;
            justify-content: center;
            font-weight: 600;
            border: 1px solid #fff;
            align-items: center;
        }
    </style>

<script>
    document.addEventListener('alpine:init', () => {
        Alpine.data('xHomePage', () => ({
            cart: [],
            dataLocalStorage:[],
            countCart: 0,
            profileToggle: false,
            init() {
                this.cart = this.getCartData();
                this.countCart = this.cart?.length ?? 0;
                // localStorage.setItem('cart', JSON.stringify([]));

                // Watch for changes in the cart and update countCart
                this.$watch('cart', (newValue) => {
                    this.countCart = newValue?.length ?? 0;
                });
            },
            // Specific add to cart confirmation method
            showAddCartConfirmation(orderId, orderName) {
                console.log('object');
                SelectOption({
                    title: 'Confirm Deletion',
                    description: `Are you sure you want to delete ${orderName}?`,
                    icon: 'delete',
                    itemId: orderId,
                    itemName: orderName,
                    dataCart: this.cart || [],
                    afterClose: (res) => {
                        if (res) {
                            this.$dispatch('order-deleted', { id: orderId });
                        }
                    }
                });
            },
            addCart(productID="", productName="",productImage="",productPrice="",Category="") {
                let user_id = `{{session.get('user_id')}}`;
                // console.log(user_id,'user_id')
                // console.log(this.getCartData(),'this.getCartData()')
                // Retrieve existing cart from localStorage or initialize an empty array
                this.dataLocalStorage = JSON.parse(localStorage.getItem('cart')) || [];
                // console.log(this.cart,'fsjflsjf')
                // Check if the product already exists in the cart
                let existingProduct = this.dataLocalStorage?.find(item => item.id === productID && item.user_id == user_id);
                // let existingProduct = this.cart?.find(item => item.id === productID && item.user_id == user_id);

                if (existingProduct) {
                    // If the product exists, increase its quantity
                    existingProduct.qty = (existingProduct.qty || 1) + 1;
                } else {
                    // If the product does not exist, add it to the cart with a quantity of 1
                    this.dataLocalStorage.push({ 
                                    id: productID, 
                                    name: productName, 
                                    qty: 1, 
                                    image: productImage,
                                    price: parseFloat(productPrice), 
                                    categoryName: Category,
                                    user_id:user_id
                                });
                }

                // this.cart.push({ id: orderId, name: productName, qty: 1 });
                // Save the updated cart back to localStorage
                localStorage.setItem('cart', JSON.stringify(this.dataLocalStorage));

                this.cart = this.getCartData() //JSON.parse(localStorage.getItem('cart')) || [];
                console.log(this.dataLocalStorage,'this.dataLocalStorage')
                console.log('Cart updated:', this.cart);
            },
            getCartData() {
                let user_id = `{{session.get('user_id')}}`;
                // this.cart = [];
                // Retrieve cart data from localStorage
                try {
                    var dataCart = JSON.parse(localStorage.getItem('cart')) || [];
                    console.log(dataCart,'dataCart')
                    console.log(this.cart,'dataCart')
                    if (dataCart?.length > 0){
                        return dataCart?.filter(item=>item.user_id == user_id);
                    }
                    return []
                } catch (error) {
                    console.error('Error parsing cart data:', error);
                    return [];
                }
                // console.log('getCartData,getCartData',this.cart);
            },
           
        }));
    });
</script>
