<!DOCTYPE html>
<html>
<head>
    <title>Edit Image</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
</head>
<body>
<div class="container mt-4">
    <h2>Edit Image</h2>
    <form method="POST" action="/image/image/editData/{{image.id}}" enctype="multipart/form-data">
         
        <div class="mb-3">
    <label for="image" class="form-label">Current Image</label>
    {% if image.image %}
        <img src="{{ url_for('static', filename='uploads/' + image.image) }}" alt="Current Image" style="max-width: 100px; display: block; margin-bottom: 10px;">
    {% else %}
        <p>No image uploaded.</p>
    {% endif %}
    <label for="image" class="form-label mt-2">New Image</label>
    <input type="file" class="form-control" id="image" name="image">
</div>
        <button type="submit" class="btn btn-success">Update</button>
        <a href="/image/image/image" class="btn btn-secondary">Cancel</a>
    </form>
</div>
</body>
</html>
