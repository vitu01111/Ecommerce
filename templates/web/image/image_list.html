<!DOCTYPE html>
<html>
<head>
    <title>Image List</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
</head>
<body>
<div class="container mt-4">
    <h2>Image List</h2>
    <a href="/image/image/showImage" class="btn btn-primary mb-3">Add Image</a>
    <table class="table table-bordered">
        <thead>
            <tr>
                <th>ID</th>
                <th>Image</th>
                <th>Actions</th>
            </tr>
        </thead>
        <tbody>
        {% for img in image %}
            <tr>
                <td>{{ img.id }}</td>
                <td>
                    <img src="{{ url_for('static', filename='static/uploads/' + img.image) }}" width="70" height="55" alt="">
                </td>
                <td>
                    <a href="/image/image/edit/{{img.id}}" class="btn btn-warning btn-sm">Edit</a>
                    <form action="/image/image/delete/{{img.id}}" method="post" style="display:inline;">
                        <button type="submit" class="btn btn-danger btn-sm" onclick="return confirm('Delete this image?')">Delete</button>
                    </form>
                </td>
            </tr>
        {% endfor %}
        </tbody>
    </table>
</div>
</body>
</html>
