 <!-- Include Alpine.js -->
<script src="https://cdn.jsdelivr.net/npm/alpinejs@3.x.x/dist/cdn.min.js" defer></script>

<div x-data="{ open: false }" class="relative h-screen bg-gray-100 overflow-hidden">

  <!-- Overlay (click to close sidebar) -->
  <div
    x-show="open"
    x-transition.opacity
    class="fixed inset-0 bg-black bg-opacity-50 z-30"
    @click="open = false"
  ></div>

  <!-- Sidebar -->
  <aside
    class="fixed top-0 left-0 w-64 h-full bg-white shadow-lg z-40 transform transition-transform duration-300"
    :class="{ '-translate-x-full': !open, 'translate-x-0': open }"
    @click.away="open = false"
  >
    <div class="p-4 font-bold text-lg border-b">My Sidebar</div>
    <ul class="p-4 space-y-2">
      <li><a href="#" class="block hover:bg-gray-100 rounded px-2 py-1">Dashboard</a></li>
      <li><a href="#" class="block hover:bg-gray-100 rounded px-2 py-1">Products</a></li>
      <li><a href="#" class="block hover:bg-gray-100 rounded px-2 py-1">Orders</a></li>
      <li><a href="#" class="block hover:bg-gray-100 rounded px-2 py-1">Settings</a></li>
    </ul>
  </aside>

  <!-- Page Content -->
  <div class="p-6">
    <button
      @click="open = !open"
      class="px-4 py-2 bg-blue-600 text-white rounded"
    >
      Toggle Sidebar
    </button>

    <h1 class="text-2xl font-bold mt-6">Welcome to the Page</h1>
    <p class="text-gray-700">Click the button to open the sidebar.</p>
  </div>

</div>
